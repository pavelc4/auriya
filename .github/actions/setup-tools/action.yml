name: Setup Build Environment
description: Setup all required tools for building Auriya

runs:
  using: composite
  steps:
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 26

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r29
        add-to-path: true

    - name: Setup Rust (nightly for eBPF)
      uses: dtolnay/rust-toolchain@nightly
      with:
        targets: aarch64-linux-android
        components: rust-src

    - name: Set nightly as default (kala eBPF build script needs it)
      run: rustup default nightly-x86_64-unknown-linux-gnu
      shell: bash

    - name: Install bpf-linker (prebuilt binary)
      run: |
        curl -sL "https://github.com/aya-rs/bpf-linker/releases/download/v0.11.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst" | tar --zstd -x -C "${HOME}/.cargo/bin"
      shell: bash

    - name: Install cargo-ndk
      run: cargo install cargo-ndk --locked
      shell: bash

    - name: Install Compression Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y p7zip-full zstd
      shell: bash
