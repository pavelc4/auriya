name: Package Module
description: Package Auriya module with ultra compression

inputs:
  build_type:
    description: "Type of build (debug or release)"
    required: false
    default: "debug"

outputs:
  zip_name:
    description: Name of the created zip file
    value: ${{ steps.package.outputs.zip_name }}
  sha_name:
    description: Name of the created sha256 checksum file
    value: ${{ steps.package.outputs.sha_name }}
  version:
    description: Version from Cargo.toml
    value: ${{ steps.package.outputs.version }}
  version_code:
    description: Version code (total commits)
    value: ${{ steps.package.outputs.version_code }}
  daemon_size:
    description: Stripped daemon binary size
    value: ${{ steps.package.outputs.daemon_size }}
  cli_size:
    description: Stripped CLI binary size
    value: ${{ steps.package.outputs.cli_size }}
  app_size:
    description: Manager app APK size
    value: ${{ steps.package.outputs.app_size }}
  zip_size:
    description: Packaged module zip size
    value: ${{ steps.package.outputs.zip_size }}

runs:
  using: composite
  steps:
    - name: Package Module
      id: package
      shell: bash
      run: |
        set -e

        BUILD_DIR="build/release"
        MODULE_DIR="module"

        mkdir -p "$BUILD_DIR/module"

        # 1. Base files
        cp -r "$MODULE_DIR"/* "$BUILD_DIR/module/"
        mkdir -p "$BUILD_DIR/module/config"
        cp toml/*.toml "$BUILD_DIR/module/config/" 2>/dev/null || cp *.toml "$BUILD_DIR/module/config/" 2>/dev/null || true
        cp -r module/system "$BUILD_DIR/module/" 2>/dev/null || true

        # 2. User Manager App APK
        APPS_DIR="$BUILD_DIR/module/libs/app"
        mkdir -p "$APPS_DIR"

        # upload-artifact v7 stores files relative to glob pattern, not workspace
        # root.  Use find instead of hardcoded paths so we find the APKs regardless
        # of how the artifact was laid down.
        APP_APK=$(find . -name "app-arm64-v8a-release.apk" -type f 2>/dev/null | head -1)
        if [ -z "$APP_APK" ]; then
            APP_APK=$(find . -name "*-arm64-v8a-*.apk" -type f 2>/dev/null | head -1)
        fi
        if [ -z "$APP_APK" ]; then
            APP_APK=$(find . -name "*.apk" -path "*/app/*" -type f 2>/dev/null | head -1)
        fi

        if [ -n "$APP_APK" ]; then
            cp "$APP_APK" "$APPS_DIR/auriya-app.apk"
            echo "Packaged app APK ($(du -h "$APP_APK" | cut -f1))"
        else
            echo "Warning: App APK not found — app dir will be incomplete"
        fi

        # 4. Binary (aarch64 only)
        TARGET="aarch64-linux-android"
        ARCH="aarch64"

        BIN="target/$TARGET/release/auriya"
        CLI_BIN="target/$TARGET/release/auriyactl"

        if [ -f "$BIN" ]; then
            echo "Packaging $ARCH ($TARGET)..."
            DEST_DIR="$BUILD_DIR/module/libs/$ARCH"
            mkdir -p "$DEST_DIR"

            # Copy Daemon
            cp "$BIN" "$DEST_DIR/auriya"

            # Copy CLI if exists
            if [ -f "$CLI_BIN" ]; then
                cp "$CLI_BIN" "$DEST_DIR/auriyactl"
            else
                echo "Warning: CLI Binary not found at $CLI_BIN"
            fi

            # Checksums
            (cd "$DEST_DIR" && sha256sum * > checksums.sha256)
        else
            echo "ERROR: Binary not found at $BIN" >&2
            exit 1
        fi

        # Get version from Cargo.toml
        VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
        COMMIT_HASH=$(git rev-parse --short HEAD)
        VERSION_CODE=$(git rev-list --count HEAD)

        # Filename
        BUILD_TYPE="${{ inputs.build_type }}"
        ZIP_NAME="auriya-${VERSION}-${VERSION_CODE}-${COMMIT_HASH}-${BUILD_TYPE}.zip"
        SHA_NAME="${ZIP_NAME}.sha256"

        # Update module.prop
        sed -i "s/^version=.*/version=${VERSION} (${VERSION_CODE}-${COMMIT_HASH}-${BUILD_TYPE})/" "$BUILD_DIR/module/module.prop"
        sed -i "s/^versionCode=.*/versionCode=${VERSION_CODE}/" "$BUILD_DIR/module/module.prop"

        # Clean build.sh placeholders if any
        find "$BUILD_DIR/module" -name ".placeholder" -delete 2>/dev/null || true

        cd "$BUILD_DIR/module"
        7z a -tzip -mm=Deflate -mx=9 -mfb=258 -mpass=15 "../$ZIP_NAME" .
        cd -

        # Generate SHA256 checksum for release asset verification
        (cd "$BUILD_DIR" && sha256sum "$ZIP_NAME" > "$SHA_NAME")

        DAEMON_FILE="$BUILD_DIR/module/libs/aarch64/auriya"
        CLI_FILE="$BUILD_DIR/module/libs/aarch64/auriyactl"
        APP_FILE="$BUILD_DIR/module/libs/app/auriya-app.apk"
        ZIP_FILE="$BUILD_DIR/$ZIP_NAME"

        DAEMON_SIZE=$(du -h "$DAEMON_FILE" 2>/dev/null | cut -f1 || echo "-")
        CLI_SIZE=$(du -h "$CLI_FILE" 2>/dev/null | cut -f1 || echo "-")
        APP_SIZE=$(du -h "$APP_FILE" 2>/dev/null | cut -f1 || echo "-")
        ZIP_SIZE=$(du -h "$ZIP_FILE" 2>/dev/null | cut -f1 || echo "-")

        DAEMON_SHA=$(sha256sum "$DAEMON_FILE" 2>/dev/null | awk '{print substr($1, 1, 16)}' || echo "-")
        CLI_SHA=$(sha256sum "$CLI_FILE" 2>/dev/null | awk '{print substr($1, 1, 16)}' || echo "-")
        APP_SHA=$(sha256sum "$APP_FILE" 2>/dev/null | awk '{print substr($1, 1, 16)}' || echo "-")
        ZIP_SHA=$(sha256sum "$ZIP_FILE" 2>/dev/null | awk '{print substr($1, 1, 16)}' || echo "-")

        echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
        echo "sha_name=$SHA_NAME" >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "daemon_size=$DAEMON_SIZE" >> $GITHUB_OUTPUT
        echo "cli_size=$CLI_SIZE" >> $GITHUB_OUTPUT
        echo "app_size=$APP_SIZE" >> $GITHUB_OUTPUT
        echo "zip_size=$ZIP_SIZE" >> $GITHUB_OUTPUT

        if [ -n "$GITHUB_STEP_SUMMARY" ]; then
          {
            echo "### Artifact and Size Summary"
            echo ""
            echo "| Component | Target Arch | Size | SHA-256 (Prefix) |"
            echo "| :--- | :--- | :--- | :--- |"
            echo "| **Daemon (\`auriya\`)** | \`aarch64\` | \`$DAEMON_SIZE\` | \`$DAEMON_SHA...\` |"
            echo "| **CLI (\`auriyactl\`)** | \`aarch64\` | \`$CLI_SIZE\` | \`$CLI_SHA...\` |"
            echo "| **Manager App (\`auriya-app.apk\`)** | \`arm64-v8a\` | \`$APP_SIZE\` | \`$APP_SHA...\` |"
            echo "| **Module Package (\`$ZIP_NAME\`)** | \`universal\` | \`$ZIP_SIZE\` | \`$ZIP_SHA...\` |"
            echo ""
            echo "> Build Type: \`$BUILD_TYPE\` | Version: \`$VERSION ($VERSION_CODE)\` | Commit: \`$COMMIT_HASH\`"
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        ls -lh "$BUILD_DIR/$ZIP_NAME" "$BUILD_DIR/$SHA_NAME"
