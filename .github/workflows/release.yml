name: Release Auriya

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version or tag (e.g. 2.2.1 or v2.2.1)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  CHAT_ID: ${{ secrets.CHAT_ID }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      notify_message_id: ${{ steps.notify_start.outputs.message_id }}
      release_tag: ${{ steps.resolve_version.outputs.release_tag }}
      release_version: ${{ steps.resolve_version.outputs.release_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Notify Release Start
        if: ${{ env.BOT_TOKEN != '' }}
        id: notify_start
        uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_id: ${{ secrets.CHAT_ID }}
          type: start
      - name: Configure Git for Private Deps
        run: |
          git config --global credential.helper store
          echo "https://pavelc4:${{ secrets.GH_PAT }}@github.com" > ~/.git-credentials
      - uses: ./.github/actions/setup-tools

      - name: Prepare Release Version
        id: resolve_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_VER="${{ github.event.inputs.version }}"
            VERSION="${INPUT_VER#v}"
            if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
              VERSION="${VERSION}.0"
            fi
            TAG="v$VERSION"

            sed -i "0,/^version = .*/s//version = \"$VERSION\"/" Cargo.toml
            sed -i "/name = \"auriya\"/{n;s/version = \".*\"/version = \"$VERSION\"/}" Cargo.lock

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml Cargo.lock
            git commit -m "chore(release): bump version to $TAG"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin HEAD:main --tags

            echo "release_tag=$TAG" >> $GITHUB_OUTPUT
            echo "release_version=$VERSION" >> $GITHUB_OUTPUT
          else
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            echo "release_tag=$TAG" >> $GITHUB_OUTPUT
            echo "release_version=$VERSION" >> $GITHUB_OUTPUT
          fi

  rust-binary:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.release_tag }}
      - uses: ./.github/actions/setup-tools
      - name: Cache Cargo Registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-
      - name: Build Rust Binary (aarch64)
        run: |
          TARGET="aarch64-linux-android"
          sed -i "s|/opt/android-ndk|${ANDROID_NDK_HOME}|g" .cargo/config.toml
          echo "Building for $TARGET..."
          cargo ndk -t "$TARGET" --platform 26 -- build --release --bin auriya --bin auriyactl

          BINARY="target/$TARGET/release/auriya"
          CLI_BINARY="target/$TARGET/release/auriyactl"
          LLVM_STRIP="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"

          if [ -f "$LLVM_STRIP" ]; then
              "$LLVM_STRIP" --strip-all "$BINARY"
              "$LLVM_STRIP" --strip-all "$CLI_BINARY"
          else
              strip --strip-all "$BINARY"
              strip --strip-all "$CLI_BINARY"
          fi
          sha256sum "$BINARY" > "${BINARY}.sha256"
          sha256sum "$CLI_BINARY" > "${CLI_BINARY}.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: rust-binary
          path: target/aarch64-linux-android/release/auriya*

  android-apk:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.release_tag }}
      - uses: ./.github/actions/setup-tools
      - uses: actions/checkout@v7
        with:
          repository: pavelc4/keystores
          token: ${{ secrets.KEYSTORES_SSH_KEY }}
          path: keystores-private
      - name: Setup Signing Config
        run: |
          cat > android/signing.properties << EOF
          KEYSTORE_PATH=${{ github.workspace }}/keystores-private/auriya.keystore
          KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          EOF
      - name: Build Android APKs
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: android-apks
          path: |
            android/app/build/outputs/apk/release/*.apk
  package:
    needs: [setup, rust-binary, android-apk]
    runs-on: ubuntu-latest
    outputs:
      zip_name: ${{ steps.package.outputs.zip_name }}
      sha_name: ${{ steps.package.outputs.sha_name }}
      version: ${{ steps.package.outputs.version }}
      version_code: ${{ steps.package.outputs.version_code }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.release_tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: rust-binary
          path: target/aarch64-linux-android/release/
      - uses: actions/download-artifact@v8
        with:
          name: android-apks
          path: .
      - uses: ./.github/actions/package-module
        id: package
        with:
          build_type: release
      - uses: actions/upload-artifact@v7
        with:
          name: auriya-aarch64
          path: |
            build/release/*.zip
            build/release/*.sha256
          compression-level: 0

  release:
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    needs: [setup, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.release_tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: auriya-aarch64
          path: build/release/

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.setup.outputs.release_tag }}
          name: Auriya ${{ needs.setup.outputs.release_tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            build/release/${{ needs.package.outputs.zip_name }}
            build/release/${{ needs.package.outputs.sha_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update update.json
        run: |
          VERSION="${{ needs.package.outputs.version }}"
          VERSION_CODE="${{ needs.package.outputs.version_code }}"
          ZIP_NAME="${{ needs.package.outputs.zip_name }}"
          TAG="${{ needs.setup.outputs.release_tag }}"

          # Checkout main branch to update update.json
          git checkout -B main origin/main

          cat > update.json << EOF
          {
              "version": "$VERSION",
              "versionCode": $VERSION_CODE,
              "zipUrl": "https://github.com/${{ github.repository }}/releases/download/$TAG/$ZIP_NAME",
              "changelog": "https://github.com/${{ github.repository }}/releases/latest"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore: update update.json to $TAG" || echo "No changes"
          git push origin main

      - name: Notify Release Complete
        if: ${{ needs.setup.outputs.notify_message_id != '' }}
        uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_id: ${{ secrets.CHAT_ID }}
          type: complete
          zip_file: build/release/${{ needs.package.outputs.zip_name }}
          delete_message_id: ${{ needs.setup.outputs.notify_message_id }}
          caption: |
            <b>Auriya v${{ needs.package.outputs.version }} Released!</b>

            <a href="https://github.com/${{ github.repository }}/releases/tag/${{ needs.setup.outputs.release_tag }}">GitHub Release</a>

      - name: Notify Release Failure
        if: ${{ failure() && needs.setup.outputs.notify_message_id != '' }}
        uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_id: ${{ secrets.CHAT_ID }}
          type: failure
          delete_message_id: ${{ needs.setup.outputs.notify_message_id }}
