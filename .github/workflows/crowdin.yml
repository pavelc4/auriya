name: Crowdin Sync

on:
  push:
    branches: [ main ]
    paths:
      - 'android/app/src/main/res/values/strings.xml'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Crowdin Action
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: false
          download_translations: true
          create_pull_request: true
          localization_branch_name: l10n_crowdin
          commit_message: 'chore(Crowdin): update translations'
          pull_request_title: 'chore(Crowdin): update translations'
          pull_request_body: 'Automated pull request with new and updated translations from Crowdin.'
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
