[package]
name = "auriya"
version = "2.1.0"
edition = "2024"
license = "GPL-3.0"
authors = ["pavelc4"]

[workspace]

[lib]
name = "auriya"
path = "src/lib.rs"

[[bin]]
name = "auriya"
path = "src/main.rs"

[[bin]]
name = "auriyactl"
path = "src/ctl.rs"

[[test]]
name = "tests"
path = "tests/main.rs"

[[test]]
name = "tweak_stress"
path = "tests/tweak_stress.rs"

[[test]]
name = "stream_perf"
path = "tests/stream_perf.rs"

[[test]]
name = "watchdog_chaos"
path = "tests/watchdog_chaos.rs"

[[test]]
name = "loom_concurrency"
path = "tests/loom_concurrency.rs"

[[test]]
name = "logger_test"
path = "tests/logger_test.rs"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
anyhow = "1.0.104"
notify = "8.2.0"
toml = "1.1.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = [
  "rt",
  "net",
  "sync",
  "time",
  "macros",
  "io-util",
  "signal",
  "process",
] }
tracing = { version = "0.1.44", default-features = false, features = [
  "std",
  "attributes",
] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "fmt",
  "ansi",
  "env-filter",
  "smallvec",
  "time",
] }
time = { version = "0.3.55", features = ["formatting"] }
libc = "0.2.191"
clap = { version = "4.6.7", features = ["derive", "color", "suggestions"] }
memchr = "2.8.3"
kala-ebpf = { git = "https://github.com/pavelc4/kala", branch = "main" }


[dev-dependencies]
dhat = "0.3.3"
loom = { version = "0.7.2", features = ["futures"] }
nix = { version = "0.31.3", default-features = false, features = [
  "user",
  "signal",
  "process",
  "fs",
] }
sysinfo = { version = "0.39.6", default-features = false, features = [
  "system",
] }
tempfile = "3.27.0"
tokio-test = "0.4.6"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
# Whole-group dials. Pedantic is opt-in via #[warn] on individual
# items if we ever want to enable it locally; as a workspace-wide
# default it produces too much style noise without catching real bugs.
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
